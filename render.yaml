services:
  - type: web
    name: python-tutor-ai
    runtime: python
    buildCommand: "cd frontend && npm install && npm run build && cd ../ && pip install -r requirements.txt"
    startCommand: "cd api && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: PYTHONIOENCODING
        value: utf-8
