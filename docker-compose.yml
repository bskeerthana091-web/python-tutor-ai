version: '3.8'

services:
  python-tutor-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python_tutor_ai_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONIOENCODING=utf-8
    volumes:
      - ./data:/app/data
    restart: unless-stopped
